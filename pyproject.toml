[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CLIPDock"
dynamic = ["version"]
description = "CLIPDock: a contrastive learning-based interatomic potential model for accurate protein–ligand docking"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Peng Yanfei", email = "pengyanfei@simm.ac.cn"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bioinformatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.11"
dependencies = [
    "biopython>=1.85,<2",
    "numba>=0.58,<1",
    "numpy>=1.24,<2",
    "rdkit>=2025.3.5,<2026",
    "scipy>=1.10,<2",
    "tqdm>=4.67,<5",
]

[project.optional-dependencies]
all = [
    "pandas>=2,<3",
    "posebusters==0.3.2",
    "pytorch-lightning>=2.5,<2.6",
    "torch>=2.8,<2.9",
]

[project.scripts]
clipdock = "clipdock.main:main"

[tool.setuptools.dynamic]
version = {attr = "clipdock.__version__"}

[tool.setuptools.packages.find]
include = ["clipdock*", "model*"]

[tool.setuptools.package-data]
clipdock = ["*.xml", "*.csv"]
